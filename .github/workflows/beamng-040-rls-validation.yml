name: BeamNG 0.40 RLS 2.8 source validation
on:
  push:
    branches: [beamng-0.40-careermp]
  workflow_dispatch:

jobs:
  staged-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check RLS 2.8 source contracts
        run: |
          python scripts/verify_rls_280_source.py
          python scripts/verify_rls_280_careermp.py
          python scripts/verify_rls_280_integration.py
      - name: Fetch public CareerMP 0.39 baseline for source compatibility
        run: git clone --depth=1 https://github.com/vladmaksimenko-0/CareerMP-0.39.git /tmp/careermp-039
      - name: Prepare source-only ZIP fixtures
        run: |
          (cd /tmp/careermp-039/Resources/Client/CareerMP && zip -qr /tmp/careermp-source.zip .)
          (cd upstream/rls_2.8.0_slim && zip -qr /tmp/rls-slim-source.zip .)
      - name: Check CareerMP source and server handshake
        run: |
          python scripts/check_careermp_040.py /tmp/careermp-source.zip
          python scripts/verify_careermp_040_server.py /tmp/careermp-039/Resources/Server/CareerMP/careerMP.lua
      - name: Inspect committed client activation implementation
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("Resources/Client/CareerMP.zip") as z:
              names = [n for n in z.namelist() if n.endswith("lua/ge/extensions/careerMPEnabler.lua")]
              print("Enabler entries:", names)
              for n in names:
                  lines = z.read(n).decode("utf-8-sig").splitlines()
                  for j in range(525, min(len(lines), 715)):
                      print(f"FULL {j+1}: {lines[j]}")
                  for i, line in enumerate(lines):
                      if any(k in line for k in ("requestCareerSync", "rxCareerSync", "onExtensionLoaded", "onServerLeave", "AddEventHandler", "onWorldReadyState", "local function onUpdate", "careerSyncRequested", "careerMPActive = true", "syncRequested = false")):
                          print("SIGNAL", i+1, " ".join(f"{j+1}:{lines[j]}" for j in range(max(0,i-2),min(len(lines),i+4))))
                      if "careerPatches" in line or "withRemoteVehiclesProtected" in line or "createOrLoadCareerAndStart(profileName" in line:
                          print("===== at", i+1, "=====")
                          print("\\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,i-3),min(len(lines),i+6))))
          PY
      - name: Exercise experimental builder with committed CareerMP archive
        run: |
          python scripts/build_release_040.py \
            --rls-original /tmp/rls-slim-source.zip \
            --careermp-client Resources/Client/CareerMP.zip \
            --careermp-server Resources/Server/CareerMP/careerMP.lua \
            --output /tmp/experimental-source-fixture \
            --resources-root Resources \
            --experimental
      - name: Check output artifact structure (source fixtures not playable)
        run: |
          test -s /tmp/experimental-source-fixture/rls_2.8.0_careermp_040_PATCH_ONLY.zip
          test -s /tmp/experimental-source-fixture/careermp_040_rls280_EXPERIMENTAL.zip
          test -s /tmp/experimental-source-fixture/careerMP_040_EXPERIMENTAL.lua

